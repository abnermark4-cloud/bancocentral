<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento Exclusivo - Verificação de Cadastro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: #444;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            text-align: left;
            margin: 20px 0;
            font-size: 13px;
            color: #555;
        }
        .checkbox-container input {
            width: auto;
            margin-right: 10px;
            margin-top: 3px;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: none; /* Começa oculto até o usuário confirmar os requisitos */
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
        .aviso-filtro {
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Canal de Atendimento Prioritário</h2>
        <p>Preencha os dados abaixo para verificar a liberação e prosseguir com o atendimento humanizado no WhatsApp.</p>

        <div class="form-group">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="cpf">Seu CPF (Apenas para consulta):</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
        </div>

        <!-- Filtro de Intenção / Barreira para curiosos -->
        <div class="checkbox-container">
            <input type="checkbox" id="concordo" onchange="validarFormulario()">
            <label for="concordo" style="font-weight: normal; cursor: pointer;">
                Estou ciente de que o atendimento requer o cumprimento dos procedimentos de emissão e possuo disponibilidade para finalizar o processo hoje.
            </label>
        </div>

        <button id="btnIr" class="btn-whatsapp" onclick="enviarParaWhatsApp()">Falar com Atendente no WhatsApp</button>

        <div class="aviso-filtro">
            🔒 Ambiente seguro. Apenas cliques qualificados serão direcionados.
        </div>
    </div>

    <script>
        // Lista com todos os números de WhatsApp cadastrados (com DDI 55 e DDD)
        const listaNumeros = [
            "5516982516678",
            "5516982192895",
            "5516982195327",
            "5511948594495",
            "5516976000397"
        ];

        function validarFormulario() {
            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const concordo = document.getElementById('concordo').checked;
            const btn = document.getElementById('btnIr');

            if (nome.length > 2 && cpf.length >= 11 && concordo) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        document.getElementById('nome').addEventListener('input', validarFormulario);
        document.getElementById('cpf').addEventListener('input', validarFormulario);

        function enviarParaWhatsApp() {
            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('cpf').value;
            
            // Escolhe de forma aleatória um número da lista acima a cada clique
            const numeroAleatorio = listaNumeros[Math.floor(Math.random() * listaNumeros.length)];
            
            const mensagem = `Olá, meu nome é *${nome}* (CPF: ${cpf}). Já preenchi os dados no site e tenho disponibilidade para prosseguir com o atendimento.`;
            
            const url = `https://api.whatsapp.com/send?phone=${numeroAleatorio}&text=${encodeURIComponent(mensagem)}`;
            
            window.location.href = url;
        }
    </script>

</body>
</html>
